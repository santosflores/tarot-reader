<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Complex glass gradient for the sphere body -->
    <radialGradient id="sphere_grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(20 20) rotate(45) scale(55)">
      <stop offset="0" stop-color="#F5F3FF" stop-opacity="0.3"/> <!-- Light reflection -->
      <stop offset="0.4" stop-color="#818CF8" stop-opacity="0.4"/> <!-- Mid violet/indigo -->
      <stop offset="0.8" stop-color="#4F46E5" stop-opacity="0.8"/> <!-- Deep Indigo -->
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0.95"/> <!-- Darkest edge -->
    </radialGradient>
    
    <!-- Inner glowing core (The Future) -->
    <radialGradient id="core_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 32) scale(25)">
      <stop offset="0" stop-color="#E879F9" stop-opacity="0.9"/> <!-- Bright Fuchsia Center -->
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.5"/> <!-- Purple Halo -->
      <stop offset="1" stop-color="#6B21A8" stop-opacity="0"/> <!-- Fade out -->
    </radialGradient>
    
    <!-- Sharp specularity for glass effect -->
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 14) scale(20)">
      <stop offset="0" stop-color="white" stop-opacity="0.95"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Sphere Boundary / Shadow for contrast -->
  <circle cx="32" cy="32" r="30" fill="#0F172A" fill-opacity="0.2"/>

  <!-- Main Glass Sphere -->
  <circle cx="32" cy="32" r="30" fill="url(#sphere_grad)"/>

  <!-- Inner Galaxy / Future Swirl -->
  <g opacity="0.8">
    <circle cx="32" cy="32" r="12" fill="url(#core_glow)">
       <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
       <animate attributeName="r" values="12;14;12" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Sparkles -->
  <path d="M32 24L33.5 30.5L40 32L33.5 33.5L32 40L30.5 33.5L24 32L30.5 30.5L32 24Z" fill="white" opacity="0.9">
     <animateTransform attributeName="transform" type="scale" values="0.8;1.2;0.8" dur="3s" repeatCount="indefinite" additive="sum"/>
     <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="5s" repeatCount="indefinite" additive="sum"/>
  </path>
  
  <circle cx="42" cy="25" r="1.5" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="38" r="1" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Specular Highlight (The "Glass" Look) -->
  <ellipse cx="20" cy="18" rx="14" ry="9" transform="rotate(-45 20 18)" fill="url(#highlight)"/>
  
  <!-- Secondary Rim Light (Bounce) -->
  <path d="M18 50 Q 32 60 46 50" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" fill="none"/>

</svg>
